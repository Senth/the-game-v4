name: Publish container to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Get image name and tags
        id: metadata
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS=("$IMAGE:main" "$IMAGE:sha-${GITHUB_SHA:0:7}")
          else
            VERSION=${GITHUB_REF_NAME#v}
            TAGS=("$IMAGE:v$VERSION" "$IMAGE:$VERSION" "$IMAGE:latest")
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building from ref: $GITHUB_REF"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          echo "Published:"
          while IFS= read -r tag; do
            echo "  $tag"
          done <<< "$TAGS"
