[gates]
commands = ["pnpm lint --write", "pnpm typecheck", "pnpm test", "pnpm build", "pnpm e2e"]

[review]
visible_paths = ["app/**", "components/**", "styles/**", "public/**"]
browser = true

[dev]
start = "scripts/dev-stack.sh up"
url = "http://localhost:$(scripts/dev-stack.sh ports)"
stop = "scripts/dev-stack.sh down"
auth = "log in as admin / admin for /admin, or Ninjas / ninjas for the game"

# Ports are claimed from 7000-7999 in the machine-wide registry ~/.local/state/dev-ports.
# The ports land in .tmp/dev-stack/stack.json; see docs/TESTS.md for fixture and lifecycle details.

[design]
contract = "docs/DESIGN.md"
tokens = "app/globals.css"
