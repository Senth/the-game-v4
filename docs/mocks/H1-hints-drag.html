<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme {
  --color-z0:#05080d; --color-z1:#131f41; --color-z2:#2d476b; --color-field:#0e121f;
  --color-ink:#c5c7d8; --color-muted:#8a90a8; --color-link:#8c9eff; --color-head:#bbdefb;
  --color-accent:#1c7dc8; --color-accent-strong:#304ffe;
  --color-warn:#ffa500; --color-ok:#4ade80; --color-time:#0d47a1; --color-pace-ok:#4ade80; --color-pace-1:#e8c547; --color-pace-2:#ff8c1a; --color-pace-3:#b3261e; --color-team:#004d40; --color-you:#1c7dc8;
  --font-body:"Roboto Slab",serif; --font-head:"Roboto",sans-serif; --font-cond:"Roboto Condensed",sans-serif;
}
body{ @apply bg-z0 text-ink font-body; }
.label{ @apply font-cond uppercase tracking-wider text-xs text-muted; }
</style></head><body>
<header class="sticky top-0 z-10 bg-z0 flex items-center h-12 px-1 border-b border-z1 font-cond"><button class="h-11 px-3 text-link">‹ Lighthouse</button><span class="font-head text-head truncate">Backwards log</span><span class="ml-auto pr-4 text-xs text-muted">Saved</span></header>
<div class="px-4 py-2 border-b border-z1"><div class="grid grid-cols-2 rounded-md bg-z1 p-1 font-cond text-sm"><button class="h-9 rounded bg-z2 text-head">Edit</button><button class="h-9 text-muted">Preview</button></div></div>
<main class="px-4 py-5"><div class="opacity-40 space-y-5"><label class="block"><span class="label block mb-1.5">Points</span><input class="w-full h-11 rounded-md bg-field border border-z2 px-3 text-sm focus:border-accent" value="50"></label><label class="block"><span class="label block mb-1.5">Admin notes</span><input class="w-full h-11 rounded-md bg-field border border-z2 px-3 text-sm focus:border-accent" value="Reverse each line, last letters spell the answer."></label></div>
<div class="mt-8"><div class="flex items-end justify-between border-b border-z2 pb-2"><span class="label">Hints</span><span class="font-cond text-sm text-muted">Worth with all hints: <span class="text-ink">15p</span></span></div><ul class="relative"><li class="flex items-center gap-3 min-h-12 border-b border-z1 "><span class="flex-1 min-w-0 truncate text-sm">Start from the bottom.</span><span class="font-cond text-sm text-muted tabular-nums">−5p</span></li><li class="relative h-14 py-1"><div class="h-full rounded-md border border-dashed border-accent/60 bg-accent/5"></div><div class="absolute -left-1 -right-1 top-0 flex items-center gap-3 h-12 px-3 rounded-md bg-z2 text-head shadow-[0_8px_24px_rgba(0,0,0,.6)] rotate-[-1.2deg] -translate-y-1.5 z-10"><span class="flex-1 truncate text-sm">The answer is a place on the coast.</span><span class="font-cond text-sm tabular-nums">−20p</span></div></li><li class="flex items-center gap-3 min-h-12 border-b border-z1 border-t"><span class="flex-1 min-w-0 truncate text-sm">Every line is a word. Read the last letters, top to bottom, and you have it.</span><span class="font-cond text-sm text-muted tabular-nums">−10p</span></li></ul><button class="mt-3 h-11 px-4 rounded-md border border-dashed border-z2 font-cond text-sm text-link w-full">+ Add hint</button></div></main></body></html>
